# Bygger prosjektet og publiserer dist/ til GitHub Pages ved hver push til main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lar deg også starte den manuelt fra Actions-fanen

permissions:
  contents: read
  pages: write
  id-token: write

# Bare én publisering om gangen; en ny push avbryter ikke en som allerede er i gang.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
